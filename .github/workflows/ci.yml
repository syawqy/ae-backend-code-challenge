name: Build & Test CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
    - name: Restore dependencies
      run: dotnet restore ShipManagement.sln

    - name: Build solution
      run: dotnet build ShipManagement.sln --configuration Release --no-restore
    - name: Run Unit & Domain Tests
      run: dotnet test src/ShipManagement.Tests/ShipManagement.Tests.csproj --configuration Release --no-build --verbosity normal --filter "Category!=Integration"
